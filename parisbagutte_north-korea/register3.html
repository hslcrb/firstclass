<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../shared/favicon.svg">

    <link rel="stylesheet" href="../fonts/stylesheet/PBGothic.css">
    <link rel="stylesheet" href="../fonts/stylesheet/pretendardvariable.css">
    <link rel="stylesheet" href="../css/default.css">

    <title>회원등록 | 빠리바게뜨</title>

    <style>
        :root {
            --font: "PBGothic", sans-serif;

            /* 파리바게뜨 색상 */
            --input-bg: #F4F9FF;
            --surface-white: #FDFEFF;
            --navy: #003686;
            --gold: #C8A84E;
            --cream: #FEF5E7;
            --off-white: #FFFCF7;
            --dark-navy: #0C2340;
            --blue-gray: #7A9BBF;
            --blue-gray-thin: #CADCF0;
            --light-gold: #E8D5A3;
            --accent-blue: #1A5DAB;
            --border-bluegray: #E7E9EC;
        }

        html {
            font-size: 62.5%;
        }

        body {
            min-width: 360px;
            font-family: "Pretendard Variable", sans-serif;
            font-size: 1.6rem;
            color: var(--dark-navy);
            background-color: var(--surface-white);
        }

        h1,
        h2 {
            font-family: var(--font);
        }

        #wrap {
            width: 100%;
            max-width: 1024px;
            min-width: 360px;
            min-height: 100dvh;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--surface-white);
        }

        header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 48px;
        }

        h1 {
            font-size: 2rem;
            line-height: 1;
            font-weight: 700;
        }

        .prev_btn {
            position: absolute;
            top: 0;
            left: -20px;
            width: 48px;
            height: 48px;
            background: url("images/Icon/ArrowLeft.svg") no-repeat center / 48px;
        }

        main {
            width: 100%;
            padding-top: 32px;
        }

        .intro {
            position: relative;
            width: 100%;
            min-height: 154px;
            margin-bottom: 16px;
        }

        .title {
            display: flex;
            flex-direction: column;
            gap: 10px;
            line-height: 1;
        }

        .title > span:first-child {
            font-size: 1.8rem;
            font-weight: 400;
        }

        .title > span:nth-child(2),
        .title > span:last-child {
            font-size: 2rem;
            font-weight: 700;
        }

        .description {
            margin-top: 10px;
            font-size: 1.6rem;
            font-weight: 400;
            line-height: 1.2;
            color: var(--blue-gray);
        }

        .welcome_img {
            position: absolute;
            top: -8px;
            right: -24px;
            width: 114px;
            height: 134px;
        }

        form {
            display: flex;
            width: 100%;
        }

        fieldset {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
            min-width: 0;
        }

        .terms_all {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .terms_all span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1.6rem;
            font-weight: 400;
            line-height: 1.2;
        }

        .terms_all .check + span::before {
            content: "";
            flex: 0 0 30px;
            width: 30px;
            height: 30px;
            background: url("images/State=Unselected.svg") no-repeat center / contain;
        }

        .terms_all .check:checked + span::before {
            background-image: url("images/State=Selected.svg");
        }

        .terms_list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            margin-top: 44px;
        }

        .terms_list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
        }

        .term_label {
            display: flex;
            align-items: center;
            min-width: 0;
            cursor: pointer;
        }

        .term_label span {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            font-size: 1.6rem;
            font-weight: 400;
            line-height: 1.2;
        }

        .term_label .check + span::before {
            content: "";
            flex: 0 0 20px;
            width: 20px;
            height: 20px;
            background: url("images/Size=Large,%20State=Unselected.svg") no-repeat center / contain;
        }

        .term_label .check:checked + span::before {
            background-image: url("images/Size=Large,%20State=Selected.svg");
        }

        .terms_list a {
            flex: 0 0 auto;
            font-size: 1.4rem;
            font-weight: 400;
            line-height: 1;
            color: var(--dark-navy);
            text-decoration: underline;
            text-underline-position: from-font;
        }

        .marketing {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: calc(100% - 63px);
            margin-top: 8px;
            margin-left: 63px;
        }

        .marketing_title {
            font-size: 1.2rem;
            font-weight: 400;
            line-height: 1;
            color: var(--blue-gray);
        }

        .marketing_list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .marketing_list label {
            display: flex;
            align-items: center;
            cursor: default;
        }

        .marketing_list span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1.4rem;
            font-weight: 400;
            line-height: 1.2;
            color: var(--blue-gray);
        }

        .marketing_list .check + span::before {
            content: "";
            flex: 0 0 20px;
            width: 20px;
            height: 20px;
            background: url("images/Size=Large,%20State=Unselected.svg") no-repeat center / contain;
        }

        .marketing_list .check:checked + span::before {
            background-image: url("images/Size=Large,%20State=Selected.svg");
        }

        .marketing_list span > span {
            opacity: 40%;
        }

        .join_btn {
            width: 100%;
            height: 44px;
            margin-top: 80px;
            border-radius: 999px;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--surface-white);
            background-color: var(--navy);
        }

        .join_btn:disabled {
            opacity: 20%;
            cursor: default;
        }

        @media (min-width: 600px) {
            .welcome_img {
                right: 0;
            }
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>

<body class="style-page">
    <div id="wrap">
        <header>
            <h1>회원등록</h1>

            <button type="button" class="prev_btn">
                <span class="sr-only">이전단추</span>
            </button>
        </header>

        <main>
            <div class="intro">
                <h2 class="title">
                    <span>마음의 자리</span>
                    <span>빠리바게뜨 봉사 리용규정에</span>
                    <span>동의하여주십시오.</span>
                </h2>

                <p class="description">
                    가입하려면 리용규정에 동의한 후<br>
                    본인확인을 진행하십시오.
                </p>

                <img
                    src="images/Brand/Eiffel.svg"
                    alt=""
                    class="welcome_img"
                >
            </div>

            <form action="">
                <fieldset>
                    <legend class="sr-only">빠리바게뜨 회원등록 리용규정 동의</legend>

                    <label class="terms_all">
                        <input type="checkbox" class="check sr-only" checked>
                        <span>필수항목에만 동의합니다.</span>
                    </label>

                    <ul class="terms_list">
                        <li>
                            <label class="term_label">
                                <input type="checkbox" class="check sr-only" required checked>
                                <span>[필수] 만 14세 이상입니다.</span>
                            </label>
                            <a href="#">보기</a>
                        </li>

                        <li>
                            <label class="term_label">
                                <input type="checkbox" class="check sr-only" required checked>
                                <span>[필수] 봉사 리용규정</span>
                            </label>
                            <a href="#">보기</a>
                        </li>

                        <li>
                            <label class="term_label">
                                <input type="checkbox" class="check sr-only" required checked>
                                <span>[필수] 개인정보 수집/리용동의</span>
                            </label>
                            <a href="#">보기</a>
                        </li>

                        <li>
                            <label class="term_label">
                                <input type="checkbox" class="check sr-only" required checked>
                                <span>[필수] 위치기반 봉사 리용규정</span>
                            </label>
                            <a href="#">보기</a>
                        </li>

                        <li>
                            <label class="term_label">
                                <input type="checkbox" class="check sr-only" checked>
                                <span>[선택] 판매촉진 활용 수집/리용 동의</span>
                            </label>
                            <a href="#">보기</a>
                        </li>
                    </ul>

                    <div class="marketing">
                        <p class="marketing_title">
                            행사/다양한 특전 정보 및 판매촉진(광고성) 정보 수신
                        </p>

                        <div class="marketing_list">
                            <label>
                                <input type="checkbox" class="check sr-only" checked>
                                <span><span>문자통보 수신 동의</span></span>
                            </label>

                            <label>
                                <input type="checkbox" class="check sr-only" checked>
                                <span><span>봉사 특전 알림(통보)</span></span>
                            </label>

                            <label>
                                <input type="checkbox" class="check sr-only" checked>
                                <span><span>야간 알림 수신 동의(오후 9시~이튿날 오전 8시)</span></span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="join_btn">
                        본인확인
                    </button>
                </fieldset>
            </form>
        </main>
    </div>
</body>
</html>
