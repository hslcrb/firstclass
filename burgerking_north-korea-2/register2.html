<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../shared/favicon.svg">

    <link rel="stylesheet" href="../fonts/stylesheet/BKBulMatPro.css">
    <link rel="stylesheet" href="../fonts/stylesheet/SDGothicNeoRound.css">
    <link rel="stylesheet" href="../fonts/stylesheet/pretendardvariable.css">
    <link rel="stylesheet" href="../css/default.css">

    <title>회원등록 | 버거킹</title>

    <style>
        :root {
            --font: "SD Gothic Neo Round", "SDGothicNeoRound", sans-serif;
            --font-pre: "Pretendard Variable", sans-serif;
            --font-BKR: "BKBulMatPro", sans-serif;
            --disabled: #DDCDBE;

            /* 버거킹 색상 */
            --primary: #512314;
            --focus: #D62302;
            --baseBorder: #D9CFC6;
            --inputBg: #FFFCF9;
            --errorColor: #C54734;
            --placeholder: #EBE6E2;
            --text: #766053;
            --bg: #F4EBDC;
            --button: #E9DDCD;
        }

        html {
            font-size: 62.5%;
        }

        body {
            min-width: 360px;
            font-family: var(--font);
            font-size: 1.6rem;
            color: var(--primary);
            background-color: var(--bg);
        }

        #wrap {
            width: 96%;
            max-width: 1024px;
            min-width: 360px;
            min-height: 100dvh;
            margin: 0 auto;
            padding: 20px;
            background-color: var(--bg);
        }

        header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 48px;
        }

        h1 {
            font-size: 2rem;
            line-height: 1;
            font-weight: 800;
        }

        .prev_btn {
            position: absolute;
            top: 0;
            left: -20px;
            width: 48px;
            height: 48px;
            background: url("images/Arrow%20Left.svg") no-repeat center / auto;
        }

        main {
            display: flex;
            flex-direction: column;
            width: 100%;
            padding-top: 32px;
        }

        .intro {
            position: relative;
            width: 100%;
            min-height: 154px;
            margin-bottom: 16px;
        }

        .title {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            font-family: var(--font-BKR);
            line-height: 1;
        }

        .title > span:first-child {
            font-size: 1.8rem;
        }

        .title > span:nth-child(2),
        .title > span:last-child {
            font-size: 2.4rem;
        }

        .description {
            margin-top: 10px;
            font-family: var(--font-pre);
            font-size: 1.6rem;
            font-weight: 500;
            line-height: 1.2;
            color: var(--text);
        }

        .welcome_img {
            position: absolute;
            top: -24px;
            right: -20px;
            width: 90px;
            height: 160px;
        }

        form {
            display: flex;
            width: 100%;
        }

        fieldset {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            width: 100%;
            min-width: 0;
        }

        .agree_all {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.2;
            cursor: pointer;
        }

        .agree_all span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .agree_all span::before {
            content: "";
            flex: 0 0 30px;
            width: 30px;
            height: 30px;
            background: url("images/Check%20Boxes%20Disabled.svg") no-repeat center / contain;
        }

        .agree_all input:checked + span::before {
            background-image: url("images/Check%20Boxes%20Active.svg");
        }

        .agree_desc {
            margin-top: 8px;
            padding-left: 38px;
            font-family: var(--font-pre);
            font-size: 1.4rem;
            font-weight: 500;
            line-height: 1.2;
            color: var(--text);
        }

        .terms_list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            margin-top: 17px;
            padding-top: 17px;
            border-top: 1px solid rgb(81 35 20 / 10%);
        }

        .terms_list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            width: 100%;
        }

        .term_label {
            display: flex;
            align-items: center;
            min-width: 0;
            cursor: pointer;
        }

        .term_label span {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            font-size: 1.6rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .term_label span::before {
            content: "";
            flex: 0 0 20px;
            width: 20px;
            height: 20px;
            background: url("images/Check%20Large%20Inactive.svg") no-repeat center / contain;
        }

        .term_label input:checked + span::before {
            background-image: url("images/Check%20Large%20Active.svg");
        }

        .terms_list a {
            flex: 0 0 auto;
            font-family: var(--font-pre);
            font-size: 1.4rem;
            font-weight: 500;
            color: var(--primary);
            text-decoration: underline;
            text-underline-position: from-font;
        }

        .marketing_title {
            margin-top: 28px;
            padding-left: 28px;
            font-size: 1.2rem;
            font-weight: 700;
            line-height: 1;
            color: var(--text);
        }

        .marketing_list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 12px;
            padding-left: 28px;
        }

        .marketing_list label {
            display: flex;
            align-items: center;
            cursor: default;
        }

        .marketing_list label > span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 1.4rem;
            font-weight: 700;
            line-height: 1.2;
            color: var(--text);
        }

        .marketing_list label > span > span {
            opacity: 40%;
        }

        .marketing_list label > span::before {
            content: "";
            flex: 0 0 20px;
            width: 20px;
            height: 20px;
            background: url("images/Check%20Large%20Disabled.svg") no-repeat center / contain;
        }

        .join_btn {
            width: 100%;
            height: 44px;
            margin-top: 36px;
            border-radius: 999px;
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--placeholder);
            background-color: var(--primary);
        }

        .join_btn:disabled {
            opacity: 20%;
            cursor: default;
        }

        @media (min-width: 600px) {
            .intro {
                min-height: 168px;
            }

            .welcome_img {
                right: 0;
            }
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>

<body class="style-page">
    <div id="wrap">
        <header>
            <h1>회원등록</h1>

            <button type="button" class="prev_btn">
                <span class="sr-only">이전단추</span>
            </button>
        </header>

        <main>
            <div class="intro">
                <h2 class="title">
                    <span>어서 오십시오</span>
                    <span>버거킹 봉사 리용규정에</span>
                    <span>동의하여주십시오.</span>
                </h2>

                <p class="description">
                    가입하려면 리용규정에 동의한 후<br>
                    본인확인을 진행하십시오.
                </p>

                <img
                    src="images/French%20Fries%20Hand.svg"
                    alt=""
                    class="welcome_img"
                >
            </div>

            <form action="">
                <fieldset>
                    <legend class="sr-only">버거킹 회원등록 리용규정 동의</legend>

                    <label class="agree_all">
                        <input type="checkbox" class="sr-only">
                        <span>예, 모두 동의합니다.</span>
                    </label>

                    <p class="agree_desc">
                        전체동의에는 필수정보와 선택정보에 대한 동의가 포함되며,
                        항목별로 동의를 선택할수 있습니다.
                    </p>

                    <ul class="terms_list">
                        <li>
                            <label class="term_label">
                                <input type="checkbox" class="sr-only" required checked>
                                <span>[필수] 만 14세 이상입니다.</span>
                            </label>
                            <a href="#">보기</a>
                        </li>

                        <li>
                            <label class="term_label">
                                <input type="checkbox" class="sr-only" required checked>
                                <span>[필수] 봉사 리용규정</span>
                            </label>
                            <a href="#">보기</a>
                        </li>

                        <li>
                            <label class="term_label">
                                <input type="checkbox" class="sr-only" required checked>
                                <span>[필수] 개인정보 수집/리용동의</span>
                            </label>
                            <a href="#">보기</a>
                        </li>

                        <li>
                            <label class="term_label">
                                <input type="checkbox" class="sr-only" required checked>
                                <span>[필수] 위치기반 봉사 리용규정</span>
                            </label>
                            <a href="#">보기</a>
                        </li>

                        <li>
                            <label class="term_label">
                                <input type="checkbox" class="sr-only">
                                <span>[선택] 판매촉진 활용 수집/리용 동의</span>
                            </label>
                            <a href="#">보기</a>
                        </li>
                    </ul>

                    <p class="marketing_title">
                        행사/다양한 특전 정보 및 판매촉진(광고성) 정보 수신
                    </p>

                    <div class="marketing_list">
                        <label>
                            <input type="checkbox" class="sr-only" disabled>
                            <span><span>문자통보 수신 동의</span></span>
                        </label>

                        <label>
                            <input type="checkbox" class="sr-only" disabled>
                            <span><span>봉사 특전 알림(통보)</span></span>
                        </label>

                        <label>
                            <input type="checkbox" class="sr-only" disabled>
                            <span><span>야간 알림 수신 동의(오후 9시~이튿날 오전 8시)</span></span>
                        </label>
                    </div>

                    <button type="submit" class="join_btn">
                        본인확인
                    </button>
                </fieldset>
            </form>
        </main>
    </div>
</body>
</html>
