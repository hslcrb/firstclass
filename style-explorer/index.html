<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>디자인 모아보기 | Firstclass</title>
<link rel="icon" href="../shared/favicon.svg">
<link rel="stylesheet" href="../fonts/stylesheet/pretendardvariable.css">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="shell">
  <header class="topbar"><h1 class="brandmark">디자인 모아보기</h1><a class="back-link" href="../index.html">전체 목록 ↗</a></header>
  <main>
    <section class="workspace" aria-label="디자인 살펴보기">
      <aside class="panel collection">
        <div class="collection-head"><div><h2>디자인 고르기</h2></div><span class="count-pill" id="result-count"></span></div>
        <label class="search"><span aria-hidden="true">⌕</span><input type="search" id="search" placeholder="스타일 검색" autocomplete="off"></label>
        <div class="theme-grid" id="theme-grid" role="group" aria-label="디자인 스타일 목록"></div>
        <p class="empty" id="empty" hidden>검색 결과가 없습니다.</p>
      </aside>
      <div class="main-column">
        <section class="panel controls" aria-label="미리보기 설정">
          <div class="controls-title"><div><h2>화면 설정</h2></div><button id="compare-toggle" class="compare-toggle" type="button" aria-pressed="false"><span aria-hidden="true">◫</span> 두 스타일 비교</button></div>
          <div class="control-grid">
            <div class="field"><span class="field-label">브랜드</span><div class="segmented" role="group" aria-label="브랜드 선택"><button type="button" class="brand-button active" data-brand="parisbagutte" aria-pressed="true">파리바게뜨</button><button type="button" class="brand-button" data-brand="burgerking" aria-pressed="false">버거킹</button></div></div>
            <label class="field" for="screen"><span class="field-label">화면</span><select id="screen"></select></label>
            <label class="field" for="theme-select"><span class="field-label">디자인</span><select id="theme-select"></select></label>
            <label class="field compare-field" id="compare-field" for="compare-select" hidden><span class="field-label">비교할 디자인</span><select id="compare-select"></select></label>
          </div>
        </section>
        <section class="panel preview-panel" aria-label="디자인 미리보기">
          <div class="preview-top"><div><h2 id="preview-heading">Original</h2></div><div class="preview-actions"><div class="view-modes" role="group" aria-label="미리보기 크기"><button type="button" class="view-mode active" data-view="desktop" aria-pressed="true">넓게</button><button type="button" class="view-mode" data-view="mobile" aria-pressed="false">모바일</button></div><a id="open-page" class="open-page" href="../parisbagutte/login.html" target="_blank" rel="noopener noreferrer">새 창 <span aria-hidden="true">↗</span></a></div></div>
          <div class="preview-grid" id="preview-grid">
            <div class="preview-item"><div class="preview-label"><span id="preview-label">Original</span><a id="open-primary" href="../parisbagutte/login.html" target="_blank" rel="noopener noreferrer">화면 열기 ↗</a></div><div class="frame-stage"><iframe id="preview" title="선택한 디자인 미리보기" src="../parisbagutte/login.html"></iframe></div></div>
            <div class="preview-item" id="comparison" hidden><div class="preview-label"><span id="comparison-label"></span><a id="open-comparison" target="_blank" rel="noopener noreferrer">화면 열기 ↗</a></div><div class="frame-stage"><iframe id="comparison-preview" title="비교 디자인 미리보기" loading="lazy"></iframe></div></div>
          </div>
        </section>
      </div>
    </section>
  </main>
</div>
</body>
</html>
