<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid-template-areas</title>
    <link rel="stylesheet" href="../css/default.css">
    <style>
        .nh-container {
            display: grid;
            gap: 10px;

            grid-template-columns: repeat(4, 1fr);
            grid-template-areas:
                ". . . a"
                ". . b c"
                ". d e f"
                "g h i ."
            ;
            width: 90%;
            max-width: 1280px;
            margin: 30px auto;
        }
        .nh-container > div {
            background-color: lightgray;
            display: 16px;
            border-radius: 10px;
            min-height: 100px; /* 최소적 높이값 */
        }
        .nh-container > .grid01 { grid-area: a; }
        .nh-container > .grid02 { grid-area: b; }
        .nh-container > .grid03 { grid-area: c; }
        .nh-container > .grid04 { grid-area: d; }
        .nh-container > .grid05 { grid-area: e; }
        .nh-container > .grid06 { grid-area: f; }
        .nh-container > .grid07 { grid-area: g; }
        .nh-container > .grid08 { grid-area: h; }
        .nh-container > .grid09 { grid-area: i; }

        @media (max-width: 768px) {
            .nh-container {
                grid-template-columns: repeat(2, 1fr);
                grid-template-areas:
                    "a a"
                    "b c"
                    "d e"
                    "f g"
                    "h i"
                ;
            }
        }
    </style>
</head>
<body>
    <div class="nh-container">
        <div class="grid01">NH농협리츠운용</div>
        <div class="grid02">NH농협은행</div>
        <div class="grid03">NH저축은행</div>
        <div class="grid04">NH투자증권</div>
        <div class="grid05">NH-Amundi자산운용</div>
        <div class="grid06">NH벤처투자</div>
        <div class="grid07">NH농협생명</div>
        <div class="grid08">NH농협손해보험</div>
        <div class="grid09">NH농협캐피탈</div>
    </div>
</body>
</html>
