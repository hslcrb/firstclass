<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그리드 기초</title>
    <style>
        * { margin: 0; padding: 0; }
        .container {
            margin: 50px;
            border: 1px solid lightblue;
            padding: 20px;
        }
        .container > div {
            padding: 20px;
            border-radius: 10px;
        }
        .container > div:nth-child(even) {
            background-color: lightcoral;
        }
        .container > div:nth-child(odd) {
            background-color: lightgray;
        }

        .container {
            display: grid;
            /*grid-template-columns: repeat(3, 1fr);*/
            /** grid-template-columns: 2fr 1fr 1fr; **/
            /* grid-template-columns: 200px 1fr 1fr; */
            /*grid-template-columns: minmax(80px) auto 1fr; */
            grid-template-columns: repeat(3, minmax(200px, 1fr));
            gap: 10px; /* Figma의 hug를 하고싶다면, auto */
            /* flex는 순서 변경 가능하다 */
        }
        .grid01 {
            /* 라인번호로 아이템이 위치할 영역을 지정한다 */
            /*grid-column: 1 / 3;*/
            /*grid-row: 1 / 3;*/
            /* 가로,세로 행,렬 로우,컬럼 이렇게 이해하면 쉽다. */
            /* 식사 후, 그리드에 대한 설명을 더 해주신다고 하셨다. */
        }
        /* 1025px 이상은 위의 것을 따라간다 */
        @media (max-width: 1024px) {
            .grid01 {
                grid-column: auto;
                grid-row: auto;
            }
        }

        .auto-container {
            bordefr: 1px solid red;
            padding: 20px;
        }
        .auto-container > div {
            background-color: tomato;
            border-radius: 10px;
        }
        .auto-container {
            display: grid;
            gap: 10px;
        }
    </style> <!-- 균등하게 fr, 가져간다. ()-->
</head>
<body>
    <div class="container">
        <div class="grid01">아이템01</div>
        <div class="grid02">아이템02</div>
        <div class="grid03">아이템03</div>
        <div class="grid04">아이템04</div>
        <div class="grid05">아이템05</div>
        <div class="grid06">아이템06</div>
    </div>

    <div class="auto-container">
        <div class="grid01">아이템01</div>
        <div class="grid02">아이템02</div>
        <div class="grid03">아이템03</div>
    </div>
</body>
</html>
