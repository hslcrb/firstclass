<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그리드 기초</title>
    <style>
        * { margin: 0; padding: 0; }
        .container {
            margin: 50px;
            border: 1px solid lightblue;
            padding: 20px;
        }
        .container > div {
            padding: 20px;
            border-radius: 10px;
        }
        .container > div:nth-child(even) {
            background-color: lightcoral;
        }
        .container > div:nth-child(odd) {
            background-color: lightgray;
        }

        .container {
            display: grid;
            /** grid-template-columns: repeat(3, 1fr); **/
            /** grid-template-columns: 2fr 1fr 1fr; **/
            /* grid-template-columns: 200px 1fr 1fr; */
            grid-template-columns: 1fr auto 1fr;
            gap: 10px;
        }
    </style> <!-- 균등하게 fr, 가져간다. ()-->
</head>
<body>
    <div class="container">
        <div class="grid01">아이템01</div>
        <div class="grid02">아이템02</div>
        <div class="grid03">아이템03</div>
        <div class="grid04">아이템04</div>
        <div class="grid05">아이템05</div>
        <div class="grid06">아이템06</div>
    </div>
</body>
</html>
